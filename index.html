<!-- Firebase SDK v9 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyBgWsmcEoNoiemwL-Vl8M2v-Fyz2AedAqA",
            authDomain: "top-goal-lesson-55a48.firebaseapp.com",
            databaseURL: "https://top-goal-lesson-55a48-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "top-goal-lesson-55a48",
            storageBucket: "top-goal-lesson-55a48.firebasestorage.app",
            messagingSenderId: "388539643792",
            appId: "1:388539643792:web:889e2adf6cc9a2619ae515"
        };

        // تهيئة Firebase و Realtime Database
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const stateRef = ref(db, 'liveLessonState');

        // دالة رفع التحديثات فوراً إلى Firebase
        window.syncDataToFirebase = function() {
            set(stateRef, window.state).catch(err => console.log("خطأ في مزامنة Firebase:", err));
        };

        // الاستماع الفوري والتحديث اللحظي لجميع الأجهزة المتصلة
        onValue(stateRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.state = data;
                window.renderUIFromState();
            }
        });
    </script>
